name: Build extractor

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Portable (macOS + Windows + Linux, needs .NET 10 runtime)
        run: dotnet publish tools/ripper/Ripper.csproj -c Release -o out/ripper-portable
      - name: Self-contained builds
        run: |
          for rid in osx-arm64 osx-x64 win-x64; do
            dotnet publish tools/ripper/Ripper.csproj -c Release -r $rid --self-contained true -o out/ripper-$rid
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ripper
          path: out/
